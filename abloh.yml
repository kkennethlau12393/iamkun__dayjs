# abloh.yml - CI reads this from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#config

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails abloh's check in CI. Blocks merges only if also
# marked required in branch protection.
enforce: true

# How CI rebuilds this project for abloh's check. Comments name the source file.
environment:
  runtimeImage: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d # Node 24.18.0 (the version init ran under, and a .nvmrc would outrank it), pinned to the digest abloh holds for it
  installDirectory: .
  setup: .abloh/setup.sh # written by init and yours to edit. Every cold run executes it step by step
  testCommand: npm test # scripts.test in package.json. this runs other commands rather than a test runner, so abloh cannot see the individual tests inside it: the baseline will report 0 executed tests and the run will refuse rather than score your suite. Name one runner directly here, or name a script in this package.json whose command is one runner invocation, and that changes
  # sealedTestCommand: no sealedTestCommand - your test script fans out to other commands rather than running a test runner, so abloh has none to invoke on its own. Name the way one suite is run here and proposed tests are proved with that.
  rewrittenFiles: # committed files your own install rewrites, measured as your install left them
    # Your npm install rewrote the committed file package-lock.json in a clean checkout.
    - package-lock.json
